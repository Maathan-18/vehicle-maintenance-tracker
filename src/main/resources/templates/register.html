<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Vehicle Maintenance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            min-height: 100vh;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem 0;
        }

        .register-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .register-card h1 {
            color: white;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .register-card .subtitle {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 1.5rem;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: white;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
            color: white;
        }

        .form-control.is-invalid {
            border-color: #ff6b6b;
        }

        .btn-register {
            background: white;
            color: #667eea;
            font-weight: 600;
            padding: 0.8rem 2rem;
            border-radius: 12px;
            border: none;
            width: 100%;
            transition: all 0.3s ease;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            background: #f8f9fa;
            color: #764ba2;
        }

        .form-label {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }

        .login-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: color 0.3s;
        }

        .login-link:hover {
            color: white;
        }

        .alert {
            border-radius: 12px;
            border: none;
        }

        .logo-icon {
            font-size: 2.5rem;
            color: white;
            margin-bottom: 0.5rem;
        }

        .input-group-text {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-right: none;
            color: rgba(255, 255, 255, 0.8);
            border-radius: 12px 0 0 12px;
        }

        .input-group .form-control {
            border-left: none;
            border-radius: 0 12px 12px 0;
        }

        .invalid-feedback {
            color: #ff6b6b;
        }

        .password-hint {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 0.25rem;
        }
    </style>
</head>

<body>
    <div class="register-card">
        <div class="text-center">
            <i class="fas fa-car logo-icon"></i>
            <h1>Create Account</h1>
            <p class="subtitle">Join the Smart Vehicle Maintenance Tracker</p>
        </div>

        <!-- Error Message -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/register}" th:object="${user}" method="post" novalidate>
            <div class="mb-3">
                <label class="form-label" for="name">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" th:field="*{name}"
                        th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" id="name"
                        placeholder="Enter your full name" required>
                </div>
                <div th:if="${#fields.hasErrors('name')}" class="invalid-feedback d-block">
                    <span th:errors="*{name}"></span>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" class="form-control" th:field="*{email}"
                        th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" id="email"
                        placeholder="Enter your email" required>
                </div>
                <div th:if="${#fields.hasErrors('email')}" class="invalid-feedback d-block">
                    <span th:errors="*{email}"></span>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="phone">Phone Number (Optional)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-phone"></i></span>
                    <input type="tel" class="form-control" th:field="*{phone}"
                        th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''" id="phone"
                        placeholder="10-digit phone number">
                </div>
                <div th:if="${#fields.hasErrors('phone')}" class="invalid-feedback d-block">
                    <span th:errors="*{phone}"></span>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" th:field="*{password}"
                        th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" id="password"
                        placeholder="Create a password" required>
                </div>
                <div class="password-hint">Min 8 chars, 1 uppercase, 1 number, 1 special character</div>
                <div th:if="${#fields.hasErrors('password')}" class="invalid-feedback d-block">
                    <span th:errors="*{password}"></span>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label" for="confirmPassword">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" th:field="*{confirmPassword}"
                        th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                        id="confirmPassword" placeholder="Confirm your password" required>
                </div>
                <div th:if="${#fields.hasErrors('confirmPassword')}" class="invalid-feedback d-block">
                    <span th:errors="*{confirmPassword}"></span>
                </div>
            </div>

            <button type="submit" class="btn btn-register mb-3">
                <i class="fas fa-user-plus me-2"></i>Create Account
            </button>

            <p class="text-center mb-0">
                Already have an account?
                <a th:href="@{/login}" class="login-link fw-bold">Sign in here</a>
            </p>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
