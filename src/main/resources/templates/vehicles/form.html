<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editMode} ? 'Edit Vehicle' : 'Add Vehicle'">Add Vehicle - Smart Vehicle Maintenance Tracker
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --dark-bg: #1a1a2e;
            --card-bg: #16213e;
            --accent-color: #0f3460;
            --primary-color: #667eea;
            --text-light: rgba(255, 255, 255, 0.87);
            --text-muted: rgba(255, 255, 255, 0.6);
        }

        body {
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--accent-color) 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-light);
        }

        .navbar {
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-brand {
            font-weight: 700;
            color: white !important;
        }

        .nav-link {
            color: var(--text-muted) !important;
        }

        .nav-link:hover {
            color: white !important;
        }

        .form-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-label {
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-control,
        .form-select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-light);
            border-radius: 10px;
            padding: 0.75rem 1rem;
        }

        .form-control:focus,
        .form-select:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--primary-color);
            color: var(--text-light);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.25);
        }

        .form-control::placeholder {
            color: var(--text-muted);
        }

        .form-select option {
            background: var(--card-bg);
            color: var(--text-light);
        }

        .btn-primary-gradient {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            padding: 0.75rem 2rem;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-outline-light {
            border-radius: 12px;
            padding: 0.75rem 2rem;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--primary-color);
            display: inline-block;
        }

        .invalid-feedback {
            color: #ff6b6b;
        }

        .form-control.is-invalid {
            border-color: #ff6b6b;
        }

        .alert {
            border-radius: 12px;
            border: none;
        }

        .required-field::after {
            content: " *";
            color: #ff6b6b;
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-car me-2"></i>VehicleTracker
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/dashboard}">
                            <i class="fas fa-tachometer-alt me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/vehicles}">
                            <i class="fas fa-car me-1"></i>Vehicles
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Page Header -->
                <div class="mb-4">
                    <a th:href="@{/vehicles}" class="text-muted text-decoration-none">
                        <i class="fas fa-arrow-left me-2"></i>Back to Vehicles
                    </a>
                    <h2 class="mt-3 mb-1" th:text="${editMode} ? 'Edit Vehicle' : 'Add New Vehicle'">Add New Vehicle
                    </h2>
                    <p class="text-muted">Fill in the details below to register your vehicle</p>
                </div>

                <!-- Error Message -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Vehicle Form -->
                <div class="form-card">
                    <form th:action="${editMode} ? @{/vehicles/{id}/edit(id=${vehicle.id})} : @{/vehicles/add}"
                        th:object="${vehicle}" method="post" novalidate>

                        <!-- Vehicle Information -->
                        <div class="section-title">
                            <i class="fas fa-info-circle me-2"></i>Vehicle Information
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label required-field" for="regNumber">Registration Number</label>
                                <input type="text" class="form-control" th:field="*{regNumber}"
                                    th:classappend="${#fields.hasErrors('regNumber')} ? 'is-invalid' : ''"
                                    id="regNumber" placeholder="e.g., KL01AB1234" th:readonly="${editMode}" required>
                                <div th:if="${#fields.hasErrors('regNumber')}" class="invalid-feedback">
                                    <span th:errors="*{regNumber}"></span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label required-field" for="fuelType">Fuel Type</label>
                                <select class="form-select" th:field="*{fuelType}" id="fuelType" required>
                                    <option value="">Select Fuel Type</option>
                                    <option th:each="fuel : ${fuelTypes}" th:value="${fuel}"
                                        th:text="${fuel.displayName}">Petrol</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label class="form-label required-field" for="make">Make</label>
                                <input type="text" class="form-control" th:field="*{make}"
                                    th:classappend="${#fields.hasErrors('make')} ? 'is-invalid' : ''" id="make"
                                    placeholder="e.g., Hero, Honda" th:readonly="${editMode}" required>
                                <div th:if="${#fields.hasErrors('make')}" class="invalid-feedback">
                                    <span th:errors="*{make}"></span>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label required-field" for="model">Model</label>
                                <input type="text" class="form-control" th:field="*{model}"
                                    th:classappend="${#fields.hasErrors('model')} ? 'is-invalid' : ''" id="model"
                                    placeholder="e.g., Splendor, City" th:readonly="${editMode}" required>
                                <div th:if="${#fields.hasErrors('model')}" class="invalid-feedback">
                                    <span th:errors="*{model}"></span>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="variant">Variant (Optional)</label>
                                <input type="text" class="form-control" th:field="*{variant}" id="variant"
                                    placeholder="e.g., Plus, VX">
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label class="form-label required-field" for="year">Year</label>
                                <input type="number" class="form-control" th:field="*{year}"
                                    th:classappend="${#fields.hasErrors('year')} ? 'is-invalid' : ''" id="year"
                                    min="1990" th:max="${currentYear}" th:readonly="${editMode}" required>
                                <div th:if="${#fields.hasErrors('year')}" class="invalid-feedback">
                                    <span th:errors="*{year}"></span>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="engineCapacity">Engine Capacity (cc)</label>
                                <input type="number" class="form-control" th:field="*{engineCapacity}"
                                    id="engineCapacity" placeholder="e.g., 100, 1500">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="purchaseDate">Purchase Date</label>
                                <input type="date" class="form-control" th:field="*{purchaseDate}" id="purchaseDate">
                            </div>
                        </div>

                        <!-- Odometer & Service -->
                        <div class="section-title">
                            <i class="fas fa-tachometer-alt me-2"></i>Odometer & Service
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label class="form-label" for="currentOdometer">Current Odometer (km)</label>
                                <input type="number" class="form-control" th:field="*{currentOdometer}"
                                    id="currentOdometer" min="0" placeholder="e.g., 5000">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="nextServiceDate">Next Service Date</label>
                                <input type="date" class="form-control" th:field="*{nextServiceDate}"
                                    id="nextServiceDate">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="nextServiceOdometer">Next Service Odometer (km)</label>
                                <input type="number" class="form-control" th:field="*{nextServiceOdometer}"
                                    id="nextServiceOdometer" min="0" placeholder="e.g., 8000">
                            </div>
                        </div>

                        <!-- Notes -->
                        <div class="mb-4">
                            <label class="form-label" for="notes">Notes (Optional)</label>
                            <textarea class="form-control" th:field="*{notes}" id="notes" rows="3"
                                placeholder="Any additional information about the vehicle"></textarea>
                        </div>

                        <!-- Form Actions -->
                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-primary-gradient">
                                <i class="fas fa-save me-2"></i>
                                <span th:text="${editMode} ? 'Update Vehicle' : 'Add Vehicle'">Add Vehicle</span>
                            </button>
                            <a th:href="@{/vehicles}" class="btn btn-outline-light">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-uppercase registration number
        document.getElementById('regNumber').addEventListener('input', function () {
            this.value = this.value.toUpperCase();
        });
    </script>
</body>

</html>
