<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Found - Vehicle Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .error-container {
            text-align: center;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 700;
            opacity: 0.3;
        }

        .btn-home {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            padding: 0.75rem 2rem;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h2 class="mb-3" th:text="${errorType} ?: 'Page Not Found'">Page Not Found</h2>
        <p class="text-muted mb-4" th:text="${errorMessage} ?: 'The page you are looking for does not exist.'">The page
            you are looking for does not exist.</p>
        <a href="/dashboard" class="btn btn-home">
            <i class="fas fa-home me-2"></i>Back to Dashboard
        </a>
    </div>
</body>

</html>
