# =============================================
# Smart Vehicle Maintenance Tracker
# Application Configuration
# =============================================

# Server Configuration
server.port=8080

# =============================================
# MySQL Database Configuration
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/vehicle_tracker_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_PASSWORD_HERE
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / Hibernate Configuration
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# Thymeleaf Configuration
# =============================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# =============================================
# File Upload Configuration
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Upload directory path (relative to project root)
app.upload.dir=uploads
app.upload.receipts-dir=uploads/receipts

# =============================================
# Logging Configuration
# =============================================
logging.level.root=INFO
logging.level.com.luminar.tracker=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG

# =============================================
# Application Custom Properties
# =============================================
# Reminder threshold (days before due date)
app.reminder.threshold-days=7
# Reminder threshold (km before due odometer)
app.reminder.threshold-km=500
